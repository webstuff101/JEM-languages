PLG_CONTENT_JEMEMBED="JEM - Innbyggingsutvidelse"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="JEM Innbyggingsutvidelse tilbyr et JSON-API for å hente arrangementsdata fra JEM-utvidelsen."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>Utvidelsen leverer JEM-arrangementer som JSON, som kan brukes på ulike måter,&nbsp;f.eks.&nbsp;for å vise JEM-arrangementer på eksterne nettsteder (se instruksjoner nedenfor).</p><p>Standard utdata-parametere er definert i utvidelseskonfigurasjonen her. Parametrene kan suppleres og justeres av parametere i utdata-URL-en.</p><p>Eksempel:<br /><code class='rl_code'>https://domene.no/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;token=DINN_SIKKERHETSTOKEN&amp;max=10&amp;venueids=1,2&amp;category=2,3,5</code></p><p><strong>Parametrene</strong><br /><code class='rl_code'>type=today|unfinished|upcoming|archived|newest<br />featured=on|off|only<br />title=on|link|off<br />date=on|link|off<br />time=on|off<br />enddatetime=on|off<br />catids=[kommaseparerte kategori-ID-er]<br />category=on|link|off<br />venueids=[kommaseparerte lokasjons-ID-er]<br />venue=on|link|off<br />max=n<br />cuttitle=n<br />noeventsmsg=[meldingstekst]</code></p><p>Hvis du bruker mer enn én parameter, kombineres de med en logisk OG. Dette betyr at bare arrangementer som oppfyller ALLE betingelser vil vises.</p><p><strong>Token</strong>: Sikkerhetstokens for å forhindre uautoriserte forespørsler, defineres i utvidelsesinnstillingene.</p><p><strong>Forklaringer</strong>:</p><p><code>n</code>: et positivt tall<br /><code>|</code>: deler alternativer du kan velge ett fra<br /><code>type=today</code>: Dagens arrangementer<br /><code>type=unfinished</code>: Kommende og pågående arrangementer<br /><code>type=upcoming</code>: Kommende arrangementer som ikke har startet ennå<br /><code>type=archived</code>: Arkiverte arrangementer<br /><code>type=newest</code>: Nyeste arrangementer (arrangementer med høyest ID)<br /><code>max</code>: maks. antall viste arrangementer<br /><code>cuttitle</code>: maks. lengde på tittelen<br /><code>noeventsmsg</code>: melding som vises når det ikke er noen arrangementer</p><p><strong>Hvordan bygge inn JEM-arrangementer på et eksternt nettsted:</strong></p><ol><li><strong>Last ned og pakk ut filer</strong><br />Last ned zip-filen <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemevents.zip</a> og pakk den ut. Du vil få følgende fire filer:<ul><li><code>jemevents.php</code></li><li><code>jemevents.js</code></li><li><code>jemevents-example.html</code> (eksempelside som viser hvordan innbyggingen fungerer)</li><li><code>readme.txt</code> (instruksjoner for hvordan du bruker filene)</li></ul></li><li><strong>Last opp filer til din nettserver</strong><br />Last opp filene <code>jemevents.php</code> og <code>jemevents.js</code> til nettområdet til det eksterne nettstedet.<br /><em>Merk: <code>jemevents-example.html</code>-filen er valgfri og kun for referanse.</em></li><li><strong>Konfigurer innstillinger</strong><br />Åpne <code>jemevents.php</code>-filen og fyll inn konfigurasjonsdelen i henhold til dine behov.</li><li><strong>Inkluder JavaScript-filen</strong><br />På nettsiden der du vil vise arrangementene, inkluder følgende linje like før den avsluttende <code>&lt;/body&gt;</code>-taggen:<br /><code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code></li><li><strong>Legg til beholderen for arrangementene</strong><br />På stedet på siden der arrangementene skal vises, legg til følgende HTML-element:<br /><code>&lt;div id='jemevents-container'&gt;&lt;/div&gt;</code></li></ol>"
