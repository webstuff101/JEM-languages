PKG_JEM="JEM - Pakke"
PKG_JEM_INSTALLATION_DESCRIPTION="<p>JEM er en arrangementskomponent for Joomla.</p><p>Det er ikke en klassisk kalender – det er en enkel måte å administrere og presentere arrangementer for gruppen, bedriften eller fellesskapet ditt.<br>JEM tilbyr mange funksjoner og muligheter, inkludert lokasjonsadministrasjon, gjentakelse av arrangementer, påmelding, karttjenestelenker, innsending av arrangementer og lokasjoner fra grensesnittet, og mer.</p><p>Denne pakken installerer JEM-komponenten (<code>com_jem</code>) sammen med følgende moduler og utvidelser:</p><div class='row'><div class='col-md-6'><h3>Moduler</h3><ul><li>Grunnmodul for siste arrangementer (<code>mod_jem</code>)</li><li>Bredmodul for siste arrangementer (<code>mod_jem_wide</code>)</li><li>Kalendermodul (<code>mod_jem_cal</code>)</li><li>Lokasjonskartmodul (<code>mod_jem_map</code>)</li><li>Teasermodul (<code>mod_jem_teaser</code>)</li><li>Bannermodul (<code>mod_jem_banner</code>)</li><li>Jubileumsmodul (<code>mod_jem_jubilee</code>)</li><li>Typer-modul (<code>mod_jem_types</code>)</li></ul></div><div class='col-md-6'><h3>Utvidelser</h3><ul><li>Innholdsutvidelse for liste arrangementer (<code>plg_content_jemlistevents</code>)</li><li>Innbyggingsutvidelse (<code>plg_content_jemembed</code>)</li><li>Finder-utvidelse (<code>plg_finder_jem</code>)</li><li>Kommentarutvidelse (<code>plg_jem_comments</code>)</li><li>E-postutvidelse (<code>plg_jem_mailer</code>)</li><li>Hurtigikon-utvidelse (<code>plg_quickicon_jem</code>)</li><li>Handlingslogg-utvidelse (<code>plg_actionlog_jem</code>)</li></ul></div></div><p>Hvis du vil bruke noen av disse modulene og utvidelsene, må du huske å publisere dem i modulbehandleren og utvidelsesbehandleren i nettstedets backend.</p><p>Fellesskapsstøtte finner du på <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>www.joomlaeventmanager.net/forum</a></p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Endringslogg</a></p><p>JEM er basert på Eventlist av Christoph Lukes.</p>"
