PLG_CONTENT_JEMLISTEVENTS="JEM - Liste arrangementer-utvidelse"
PLG_CONTENT_JEMLISTEVENTS_XML_DESCRIPTION="<div class='jem-documentation'><p class='jem-intro'><strong>JEM Liste arrangementer</strong>-utvidelsen lar deg sømløst integrere JEM-arrangementer i Joomla-artikler eller egendefinerte moduler. Bruk <code>{jemlistevents}</code>-taggen med valgfrie parametere for å tilpasse visningen av arrangementer.</p><h2 class='jem-section-title'>Hvordan bruke</h2><p class='jem-instruction'>Legg til følgende tagg i innholdet ditt:</p><div class='jem-code'><code>{jemlistevents}</code></div><p class='jem-instruction'>Angi standardparametere i utvidelsesinnstillingene.<br>For å tilpasse utdataene fra taggen kan du endre standardparametrene i taggen. Her er den fullstendige syntaksen:</p><div class='jem-code'><code>{jemlistevents [type=today|unfinished|ongoing|upcoming|archived|newest|open|all]; [featured=on|off|only]; [title=on|link|off]; [date=on|link|off]; [time=on|off]; [enddatetime=on|off]; [eventids=n]; [catids=n]; [category=on|link|off]; [venueids=n]; [venue=on|link|off]; [max=n]; [cuttitle=n]; [noeventsmsg=msg]}</code></div><p class='jem-note'><strong>Merk:</strong> Erstatt <code>n</code> med et positivt tall, og bruk <code>|</code> for å skille alternativer (velg ett), se eksempel nedenfor.</p><h2 class='jem-section-title'>Parameterdetaljer</h2><div class='jem-parameters'><ul class='jem-parameter-list'><li class='jem-parameter'><strong>type</strong>: Spesifiserer hvilke arrangementer som skal vises.<ul class='jem-sub-parameters'><li><code>today</code>: Dagens arrangementer.</li><li><code>unfinished</code>: Kommende og pågående arrangementer.</li><li><code>ongoing</code>: Pågående arrangementer, som finner sted nå.</li><li><code>upcoming</code>: Fremtidige arrangementer som ikke har startet ennå.</li><li><code>archived</code>: Arkiverte arrangementer.</li><li><code>newest</code>: Nylig lagt til arrangementer (basert på høyeste ID-er).</li><li><code>open</code>: Åpne arrangementer uten dato/klokkeslett</li><li><code>all</code>: Alle arrangementer (tidligere, pågående, kommende og arkiverte)</li></ul></li><li class='jem-parameter'><strong>featured</strong>: Inkluder utvalgte arrangementer.<ul class='jem-sub-parameters'><li><code>on</code>: Vis utvalgte og ikke-utvalgte arrangementer.</li><li><code>off</code>: Vis kun ikke-utvalgte arrangementer (Skjul utvalgte arrangementer).</li><li><code>only</code>: Vis kun utvalgte arrangementer.</li></ul></li><li class='jem-parameter'><strong>title</strong>: Vis arrangementstitler.<ul class='jem-sub-parameters'><li><code>on</code>: Vis titler.</li><li><code>link</code>: Vis titler som lenker.</li><li><code>off</code>: Skjul titler.</li></ul></li><li class='jem-parameter'><strong>date</strong>: Vis arrangementsdatoer.<ul class='jem-sub-parameters'><li><code>on</code>: Vis datoer.</li><li><code>link</code>: Vis datoer som lenker.</li><li><code>off</code>: Skjul datoer.</li></ul></li><li class='jem-parameter'><strong>time</strong>: Vis arrangementstider.<ul class='jem-sub-parameters'><li><code>on</code>: Vis tider.</li><li><code>off</code>: Skjul tider.</li></ul></li><li class='jem-parameter'><strong>enddatetime</strong>: Vis arrangementssluttdatoer/-tider.<ul class='jem-sub-parameters'><li><code>on</code>: Vis sluttdatoer/-tider.</li><li><code>off</code>: Skjul sluttdatoer/-tider.</li></ul></li><li class='jem-parameter'><strong>eventids</strong>: Filtrer arrangementer etter arrangements-ID-er (f.eks. <code>eventids=3,10,12</code>).</li><li class='jem-parameter'><strong>catids</strong>: Filtrer arrangementer etter kategori-ID-er (f.eks. <code>catids=2,14</code>).</li><li class='jem-parameter'><strong>category</strong>: Vis arrangementskategorier.<ul class='jem-sub-parameters'><li><code>on</code>: Vis kategorier.</li><li><code>link</code>: Vis kategorier som lenker.</li><li><code>off</code>: Skjul kategorier.</li></ul></li><li class='jem-parameter'><strong>venueids</strong>: Filtrer arrangementer etter lokasjons-ID-er (f.eks. <code>venueids=2,4</code>).</li><li class='jem-parameter'><strong>venue</strong>: Vis arrangementslokasjoner.<ul class='jem-sub-parameters'><li><code>on</code>: Vis lokasjoner.</li><li><code>link</code>: Vis lokasjoner som lenker.</li><li><code>off</code>: Skjul lokasjoner.</li></ul></li><li class='jem-parameter'><strong>max</strong>: Begrens antall arrangementer som vises (f.eks. <code>max=5</code>).</li><li class='jem-parameter'><strong>cuttitle</strong>: Begrens lengden på arrangementstitler (f.eks. <code>cuttitle=25</code>).</li><li class='jem-parameter'><strong>noeventsmsg</strong>: Egendefinert melding som vises når ingen arrangementer blir funnet (f.eks. <code>noeventsmsg='Ingen arrangementer funnet'</code>).</li></ul></div><h2 class='jem-section-title'>Eksempel</h2><p class='jem-instruction'>For å vise opptil 5 kommende arrangementer fra kategori 2 og 14, bruk:</p><div class='jem-code'><code>{jemlistevents type=upcoming; catids=2,14; max=5; noeventsmsg='Ingen arrangementer funnet'}</code></div><br><h2 class='jem-section-title'>Dato- og tidsformatering</h2><p class='jem-instruction'>For avansert dato- og tidsformatering, se <a class='jem-link' href='https://www.php.net/manual/datetime.format.php' target='_blank'>PHP DateTime-dokumentasjonen</a>.</p><p class='jem-outro'>Nyt å bruke JEM Liste arrangementer-utvidelsen for å forbedre Joomla-innholdet ditt!</p></div>"
