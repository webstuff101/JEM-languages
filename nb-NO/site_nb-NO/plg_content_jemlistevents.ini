PLG_CONTENT_JEMLISTEVENTS_TYPE_DESCRIPTION="Spesifiser hvilke arrangementer som skal vises: <strong>today</strong>: Dagens arrangementer. <strong>unfinished</strong>: Kommende og pågående arrangementer. <strong>ongoing</strong>: Pågående arrangementer, som finner sted nå. <strong>upcoming</strong>: Fremtidige arrangementer som ikke har startet ennå. <strong>archived</strong>: Tidligere arrangementer. <strong>newest</strong>: Nylig lagt til arrangementer (basert på høyeste ID-er). <strong>open</strong>: Åpne arrangementer uten dato/klokkeslett. <strong>all</strong>: Alle arrangementer (tidligere, pågående, kommende og arkiverte)."
