PLG_CONTENT_JEMEMBED="JEM — плагин Embed"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_LABEL="Требовать API-токен"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_DESC="Если этот параметр включен, API-запросы должны отправить действительный токен в заголовке Authorization Bearer. Отключение аутентификации держит активные фиксированные ограничения публичных запросов."
PLG_CONTENT_JEMEMBED_API_TOKENS_LABEL="API-токены"
PLG_CONTENT_JEMEMBED_API_TOKENS_DESC="Введите до 20 строчных жетонов, разделенных запятыми. Для хранения без оригинального секрета используйте sha256: за ним следует 64-значный SHA-256 digest. Несколько записей позволяют безопасное вращение токенов."
PLG_CONTENT_JEMEMBED_BASE_URL_LABEL="Канонический JEM URL"
PLG_CONTENT_JEMEMBED_BASE_URL_DESC="Необязательный доверенный HTTP(S) базовый URL-адрес, используемый для создания абсолютного события, места проведения и ссылки категорий, например https://events. xample.org. Если пустой или неверный, API возвращает относительные ссылки и никогда не получает источник из заголовка хоста запроса."

