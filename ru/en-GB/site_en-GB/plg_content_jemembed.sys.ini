PLG_CONTENT_JEMEMBED="JEM — плагин Embed"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="JEM Embed Plugin предоставляет ограниченный JSON API для данных публичных событий JEM."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>Плагин предоставляет опубликованные события JEM в формате JSON для серверной интеграции или прокси. Храните токен API на сервере и передавайте его в заголовке HTTP <code>Authorization: Bearer YOUR_SECURITY_TOKEN</code>. Токены в параметрах URL-запроса отклоняются, поскольку URL-адреса могут сохраняться в истории браузера, журналах сервера, реферерах и промежуточных кэшах.</p><p><strong>Конечная точка</strong><br><code>https://domain.example/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;type=upcoming&amp;max=10</code></p><p><strong>Параметры</strong><br><code>type=today|unfinished|ongoing|upcoming|archived|newest|open|all<br>featured=on|off|only<br>title=on|link|off<br>date=on|link|off<br>time=on|off<br>enddatetime=on|off<br>catids=[до 50 идентификаторов категорий через запятую]<br>category=on|link|off<br>venueids=[до 50 идентификаторов мест проведения через запятую]<br>venue=on|link|off<br>max=1..100<br>start=0..10000<br>cuttitle=1..500<br>dateformat=[до 64 символов]<br>timeformat=[до 64 символов]<br>noeventsmsg=[простой текст до 200 символов]</code></p><p>Используйте <code>meta.next_start</code> как следующее значение <code>start</code>, пока оно не равно null. Значения featured следуют семантике JEM Eventslist: <code>on</code> включает все события, <code>off</code> исключает избранные события, а <code>only</code> возвращает только избранные события. Результаты всегда оцениваются с гостевым доступом, кратковременно кэшируются и защищены фиксированными квотами запросов. Настройте <strong>Канонический URL JEM</strong>, если внешним потребителям требуются абсолютные ссылки; в противном случае возвращаются безопасные относительные ссылки.</p><p><strong>Пример для внешнего веб-сайта</strong></p><ol><li>Загрузите и распакуйте <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemevents.zip</a>.</li><li>Загрузите <code>jemevents.php</code> и <code>jemevents.js</code> на внешний веб-сайт.</li><li>Установите URL-адрес источника и токен в серверном файле <code>jemevents.php</code>.</li><li>Включите <code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code> и добавьте <code>&lt;div id='feed-container'&gt;&lt;/div&gt;</code> на страницу.</li></ol>"

