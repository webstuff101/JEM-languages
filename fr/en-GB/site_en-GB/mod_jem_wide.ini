MOD_JEM_WIDE_OFFSET_HOURS_DESC="Déplace l'heure vers le futur (valeurs positives) ou vers le passé (valeurs négatives). Utilisé uniquement pour afficher les événements non archivés ; pour les événements du jour, la valeur est arrondie au jour entier. <br>Exemples : pour afficher les événements terminés depuis au moins deux heures, définissez le type sur « Événements non terminés » et le décalage sur -2. Pour afficher les événements commençant dans une semaine ou plus tard, définissez le type sur « Événements à venir » et le décalage sur 168 (7 × 24). Pour afficher les événements de demain, définissez le type sur « Aujourd'hui » et le décalage sur 24."
