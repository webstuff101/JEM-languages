PLG_CONTENT_JEMEMBED="JEM - Plugin d'intégration"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_LABEL="Exiger un token API"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_DESC="Si activé, les requêtes API doivent envoyer un jeton valide dans l'en-tête Authorization Bearer . La désactivation de l'authentification permet de limiter les requêtes publiques fixes."
PLG_CONTENT_JEMEMBED_API_TOKENS_LABEL="Tokens API"
PLG_CONTENT_JEMEMBED_API_TOKENS_DESC="Entrez jusqu'à 20 jetons aléatoires longs, séparés par des virgules. Pour un stockage sans le secret original, utilisez sha256 : suivi de son digestif SHA-256 de 64 caractères. Les entrées multiples permettent une rotation sécurisée des jetons."
PLG_CONTENT_JEMEMBED_BASE_URL_LABEL="URL du JEM canonique"
PLG_CONTENT_JEMEMBED_BASE_URL_DESC="URL de base HTTP(S) optionnelle utilisée pour créer des liens absolus d'événement, de lieu et de catégorie, par exemple https://events. xample.org. Si vide ou non valide, l'API retourne des liens relatifs et ne dérive jamais une origine de l'en-tête de la requête."

