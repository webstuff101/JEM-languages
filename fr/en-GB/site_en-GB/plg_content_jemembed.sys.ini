PLG_CONTENT_JEMEMBED="JEM - Plugin d'intégration"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="JEM Embed Plugin fournit une API JSON bornée pour les données JEM publiques."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>Le plugin fournit les événements JEM publiés au format JSON pour une intégration côté serveur ou un proxy. Conservez le jeton API sur le serveur et envoyez-le dans l'en-tête HTTP <code>Authorization: Bearer YOUR_SECURITY_TOKEN</code>. Les jetons dans les paramètres d'URL sont rejetés car les URL peuvent être stockées dans l'historique du navigateur, les journaux du serveur, les référents et les caches intermédiaires.</p><p><strong>Point d'accès</strong><br><code>https://domaine.exemple/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;type=upcoming&amp;max=10</code></p><p><strong>Paramètres</strong><br><code>type=today|unfinished|ongoing|upcoming|archived|newest|open|all<br>featured=on|off|only<br>title=on|link|off<br>date=on|link|off<br>time=on|off<br>enddatetime=on|off<br>catids=[jusqu'à 50 ID de catégories séparés par des virgules]<br>category=on|link|off<br>venueids=[jusqu'à 50 ID de lieux séparés par des virgules]<br>venue=on|link|off<br>max=1..100<br>start=0..10000<br>cuttitle=1..500<br>dateformat=[jusqu'à 64 caractères]<br>timeformat=[jusqu'à 64 caractères]<br>noeventsmsg=[texte brut jusqu'à 200 caractères]</code></p><p>Utilisez <code>meta.next_start</code> comme prochaine valeur <code>start</code> tant qu'elle n'est pas nulle. Les valeurs featured suivent la sémantique de JEM Eventslist : <code>on</code> inclut tous les événements, <code>off</code> exclut les événements en vedette et <code>only</code> renvoie uniquement les événements en vedette. Les résultats sont toujours évalués avec un accès public invité, mis en cache brièvement et protégés par des quotas de requêtes fixes. Configurez l'<strong>URL canonique JEM</strong> lorsque les consommateurs externes ont besoin de liens absolus ; sinon, des liens relatifs sécurisés sont renvoyés.</p><p><strong>Exemple pour un site web externe</strong></p><ol><li>Téléchargez et extrayez <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemevents.zip</a>.</li><li>Téléchargez <code>jemevents.php</code> et <code>jemevents.js</code> sur le site web externe.</li><li>Définissez l'URL source et le jeton dans le fichier serveur <code>jemevents.php</code>.</li><li>Incluez <code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code> et ajoutez <code>&lt;div id='feed-container'&gt;&lt;/div&gt;</code> à la page.</li></ol>"

