PLG_CONTENT_JEMEMBED="JEM - Plugin d'intégration"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="Le plugin JEM intégration fournit une API JSON pour récupérer les données d'événements de l'extension JEM."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>Le plugin affiche les événements JEM au format JSON, qui peut être utilisé de différentes manières,&nbsp;par exemple&nbsp;pour afficher les événements JEM sur n'importe quel site web externe (voir les instructions ci-dessous).</p><p>Les paramètres de sortie par défaut sont définis dans la configuration du plugin ici. Les&nbsp;paramètres peuvent être complétés et ajustés par des paramètres dans l'URL de sortie.</p><p>Exemple :<br /><code class='rl_code'>https://domaine.com/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;token=VOTRE_TOKEN_DE_SECURITE_&amp;max=10&amp;venueids=1,2&amp;category=2,3,5</code></p><p><strong>Les paramètres</strong><br /><code class='rl_code'>type=today|unfinished|upcoming|archived|newest<br />featured=on|off|only<br />title=on|link|off<br />date=on|link|off<br />time=on|off<br />enddatetime=on|off<br />catids=[ids de catégories séparés par des virgules]<br />category=on|link|off<br />venueids=[ids de lieux séparés par des virgules]<br />venue=on|link|off<br />max=n<br />cuttitle=n<br />noeventsmsg=[texte du message]</code></p><p>Si tu utilises plus d'un paramètre, ils sont combinés avec un ET logique. Cela signifie que seuls les événements correspondant à TOUTES les conditions seront affichés.</p><p><strong>Token</strong> : Jetons de sécurité pour empêcher les requêtes non autorisées, à définir dans les paramètres du plugin.</p><p><strong>Explications</strong> :</p><p><code>n</code> : un nombre positif<br /><code>|</code> : sépare les options parmi lesquelles tu peux en choisir une<br /><code>type=today</code> : Événements d'aujourd'hui<br /><code>type=unfinished</code> : Événements à venir et en cours<br /><code>type=upcoming</code> : Événements à venir pas encore commencés<br /><code>type=archived</code> : Événements archivés<br /><code>type=newest</code> : Événements les plus récents (événements avec les IDs les plus élevés)<br /><code>max</code> : nombre maximum d'événements affichés<br /><code>cuttitle</code> : longueur max. du titre<br /><code>noeventsmsg</code> : message à afficher quand il n'y a pas d'événements</p><p><strong>Comment intégrer les événements JEM dans un site web externe :</strong></p><ol><li><strong>Télécharger et extraire les fichiers</strong><br />Télécharge le fichier zip <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemevents.zip</a> et extrais-le. Tu obtiendras les quatre fichiers suivants :<ul><li><code>jemevents.php</code></li><li><code>jemevents.js</code></li><li><code>jemevents-example.html</code> (page d'exemple montrant comment fonctionne l'intégration)</li><li><code>readme.txt</code> (avec les instructions sur comment utiliser les fichiers)</li></ul></li><li><strong>Téléverser les fichiers sur ton serveur web</strong><br />Téléverse les fichiers <code>jemevents.php</code> et <code>jemevents.js</code> dans l'espace web du site externe.<br /><em>Note : Le fichier <code>jemevents-example.html</code> est optionnel et uniquement pour référence.</em></li><li><strong>Configurer les paramètres</strong><br />Ouvre le fichier <code>jemevents.php</code> et remplis la section de configuration selon tes besoins.</li><li><strong>Inclure le fichier JavaScript</strong><br />Sur la page web où tu veux afficher les événements, inclus la ligne suivante juste avant la balise de fermeture <code>&lt;/body&gt;</code> :<br /><code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code></li><li><strong>Ajouter le conteneur pour les événements</strong><br />À l'emplacement sur la page où les événements doivent apparaître, ajoute l'élément HTML suivant :<br /><code>&lt;div id='jemevents-container'&gt;&lt;/div&gt;</code></li></ol>"

