PLG_CONTENT_JEMLISTEVENTS_TYPE_LABEL="Type d'événements"
PLG_CONTENT_JEMLISTEVENTS_TYPE_DESCRIPTION="Spécifie quels événements afficher : <strong>today</strong> : Événements d'aujourd'hui. <strong>unfinished</strong> : Événements à venir et en cours. <strong>ongoing</strong> : Événements en cours, qui se déroulent maintenant. <strong>upcoming</strong> : Événements futurs pas encore commencés. <strong>archived</strong> : Événements passés. <strong>newest</strong> : Événements récemment ajoutés (basés sur les IDs les plus élevés). <strong>open</strong> : Événements ouverts sans date/heure. <strong>all</strong> : Tous les événements (passés, en cours, à venir et archivés)."
