PKG_JEM="JEM - Paquet"
PKG_JEM_INSTALLATION_DESCRIPTION="<p>JEM est un composant de gestion d'événements pour Joomla.</p><p>Il ne s'agit pas d'un calendrier classique, mais d'un moyen simple de gérer et de présenter les événements de votre groupe, entreprise ou communauté.<br>JEM offre de nombreuses fonctionnalités et possibilités, notamment la gestion des lieux, la récurrence des événements, l'inscription, les liens vers des services de cartographie, la soumission d'événements et de lieux depuis l'interface publique, et bien plus encore.</p><p>Ce pack installe le composant JEM (<code>com_jem</code>) ainsi que les modules et plugins suivants :</p><div class='row'><div class='col-md-6'><h3>Modules</h3><ul><li>Module de base Derniers événements (<code>mod_jem</code>)</li><li>Module large Derniers événements (<code>mod_jem_wide</code>)</li><li>Module Calendrier (<code>mod_jem_cal</code>)</li><li>Module Carte des lieux (<code>mod_jem_map</code>)</li><li>Module Teaser (<code>mod_jem_teaser</code>)</li><li>Module Banner (<code>mod_jem_banner</code>)</li><li>Module Jubilee (<code>mod_jem_jubilee</code>)</li><li>Module Types (<code>mod_jem_types</code>)</li></ul></div><div class='col-md-6'><h3>Plugins</h3><ul><li>Plugin Liste de contenu Événements (<code>plg_content_jemlistevents</code>)</li><li>Plugin Embed (<code>plg_content_jemembed</code>)</li><li>Plugin Finder (<code>plg_finder_jem</code>)</li><li>Plugin Commentaires (<code>plg_jem_comments</code>)</li><li>Plugin Mailer (<code>plg_jem_mailer</code>)</li><li>Plugin Quick Icon (<code>plg_quickicon_jem</code>)</li><li>Plugin Journal des actions (<code>plg_actionlog_jem</code>)</li></ul></div></div><p>Si vous souhaitez utiliser l'un de ces modules et plugins, n'oubliez pas de les publier dans le gestionnaire de modules et le gestionnaire de plugins dans le backend de votre site.</p><p>L'assistance communautaire est disponible à l'adresse <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>www.joomlaeventmanager.net/forum</a></p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Journal des modifications</a></p><p>JEM est basé sur Eventlist de Christoph Lukes.</p>"

