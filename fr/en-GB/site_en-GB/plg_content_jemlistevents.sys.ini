PLG_CONTENT_JEMLISTEVENTS="JEM - Plugin Liste de Événements"
PLG_CONTENT_JEMLISTEVENTS_XML_DESCRIPTION="Extension permettant d'afficher les événements JEM dans le contenu Joomla"
PLG_CONTENT_JEMLISTEVENTS_XML_INSTRUCTION="<div class='jem-documentation'><h1 class='jem-title'>JEM List Events</h1><p class='jem-intro'>Le plugin <strong>JEM List Events</strong> vous permet d'intégrer facilement les événements JEM à vos articles Joomla ou à vos modules personnalisés. Utilisez la balise <code>{jemlistevents}</code> avec des paramètres optionnels pour personnaliser l'affichage des événements.</p><h2 class='jem-section-title'>Comment l'utiliser</h2><p class='jem-instruction'>Ajoutez la balise suivante à votre contenu :</p><div class='jem-code'><code>{jemlistevents}</code></div><p class='jem-instruction'>Définissez les paramètres par défaut dans les paramètres du plugin.<br>Pour personnaliser l'affichage de la balise, vous pouvez modifier les paramètres par défaut dans la balise. Voici la syntaxe complète :</p><div class='jem-code'><code>{jemlistevents [type=today|unfinished|ongoing|upcoming|archived|newest|open|all]; [featured=on|off|only]; [title=on|link|off]; [date=on|link|off]; [time=on|off]; [enddatetime=on|off]; [eventids=n]; [catids=n]; [category=on|link|off]; [venueids=n]; [venue=on|link|off]; [max=n]; [cuttitle=n]; [noeventsmsg=msg]}</code></div><p class='jem-note'><strong>Remarque :</strong> Remplacez <code>n</code> par un nombre positif et utilisez <code>|</code> pour séparer les options (choisissez-en une). Voir l'exemple ci-dessous.</p><h2 class='jem-section-title'>Détails des paramètres</h2><div class='jem-parameters'><ul class='jem-parameter-list'><li class='jem-parameter'><strong>type</strong> : Spécifie les événements à afficher.<ul class='jem-sub-parameters'><li><code>today</code> : Événements du jour.</li><li><code>unfinished</code> : Événements à venir et en cours.</li><li><code>ongoing</code> : Événements en cours.</li><li><code>upcoming</code> : Événements futurs. Débutés.</li><li><code>archived</code> : Événements archivés.</li><li><code>newest</code> : Événements récemment ajoutés (selon les ID les plus élevés).</li><li><code>open</code> : Événements ouverts sans date ni heure.</li><li><code>all</code> : Tous les événements (passés, en cours, à venir et archivés).</li></ul></li><li class='jem-parameter'><strong>À la une</strong> : Inclure les événements à la une.<ul class='jem-sub-parameters'><li><code>Activé</code> : Afficher les événements à la une et les autres événements.</li><li><code>Désactivé</code> : Afficher uniquement les autres événements (masquer les événements à la une).</li><li><code>Uniquement</code> : Afficher uniquement les événements à la une.</li></ul></li><li class='jem-parameter'><strong>Titre</strong> : Afficher les titres des événements.<ul class='jem-sub-parameters'><li><code>Activé</code> : Afficher titres.</li><li><code>lien</code> : Afficher les titres sous forme de liens.</li><li><code>désactivé</code> : Masquer les titres.</li></ul></li><li class='jem-parameter'><strong>date</strong> : Afficher les dates des événements.<ul class='jem-sub-parameters'><li><code>activé</code> : Afficher les dates.</li><li><code>lien</code> : Afficher les dates sous forme de liens.</li><li><code>désactivé</code> : Masquer les dates.</li></ul></li><li class='jem-parameter'><strong>heure</strong> : Afficher les heures des événements.<ul class='jem-sub-parameters'><li><code>activé</code> : Afficher les heures.</li><li><code>désactivé</code> : Masquer les heures.</li></ul></li><li class='jem-parameter'><strong>date et heure de fin</strong> : Afficher les dates et heures de fin des événements.<ul class='jem-sub-parameters'><li><code>on</code> : Afficher les dates et heures de fin.</li><li><code>off</code> : Masquer les dates et heures de fin.</li></ul></li><li class='jem-parameter'><strong>eventids</strong>: Filtrer les événements par identifiant de événements (par exemple <code>eventids=3,10,12</code>).</li><li class='jem-parameter'><strong>catids</strong> : Filtrer les événements par identifiant de catégorie (par exemple, <code>catids=2,14</code>).</li><li class='jem-parameter'><strong>category</strong> : Afficher les catégories d'événements.<ul class='jem-sub-parameters'><li><code>on</code> : Afficher les catégories.</li><li><code>link</code> : Afficher les catégories sous forme de liens.</li><li><code>off</code> : Masquer les catégories.</li></ul></li><li class='jem-parameter'><strong>venueids</strong> : Filtrer les événements par identifiant de lieu (par exemple, <code>venueids=2,4</code>).</li><li class='jem-parameter'><strong>venue</strong> : Afficher les lieux des événements.<ul class='jem-sub-parameters'><li><code>on</code> : Afficher les lieux.</li><li><code>link</code> : Afficher les lieux sous forme de liens.</li><li><code>off</code> : Masquer les lieux.</li></ul></li><li class='jem-parameter'><strong>max</strong> : Limiter le nombre d'événements affichés (par exemple, <code>max=5</code>).</li><li class='jem-parameter'><strong>cuttitle</strong> : Limiter la longueur des titres des événements (par exemple, <code>cuttitle=25</code>).</li><li class='jem-parameter'><strong>noeventsmsg</strong> : Message personnalisé à afficher lorsqu'aucun événement n'est trouvé (par exemple, <code>noeventsmsg='Aucun événement trouvé'</code>).</li></ul></div><h2 class='jem-section-title'>Exemple</h2><p class='jem-instruction'>Pour afficher jusqu'à 5 événements à venir des catégories 2 et 14, utilisez :</p><div class='jem-code'><code>{jemlistevents type=upcoming; catids=2,14; max=5; noeventsmsg='Aucun événement trouvé'}</code></div><br><h2 class='jem-section-title'>Formatage de la date et de l'heure</h2><p class='jem-instruction'>Pour un formatage avancé de la date et de l'heure, consultez la <a class='jem-link' href='https://www.php.net/manual/datetime.format.php' target='_blank'>documentation PHP DateTime</a>.</p><p class='jem-outro'>Profitez du plugin JEM List Events pour enrichir votre contenu Joomla !</p></div>"

