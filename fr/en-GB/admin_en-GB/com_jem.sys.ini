JEM="JEM"
COM_JEM="JEM"
COM_JEM_INSTALLATION_XML_DESCRIPTION="JEM est un composant de gestion d'événements pour Joomla"
COM_JEM_INSTALLATION_DESCRIPTION="<p>JEM est un composant de gestion d'événements pour Joomla.</p><p>Il ne s'agit pas d'un calendrier classique, mais d'un moyen simple de gérer et de présenter les événements de votre groupe, entreprise ou communauté.<br>JEM offre de nombreuses fonctionnalités et possibilités qui facilitent votre travail, telles que la base de données des lieux, la récurrence des événements et bien plus encore. <br>Mais JEM offre également des fonctionnalités supplémentaires aux visiteurs de votre site, comme un système d'inscription simple, des liens vers des services de cartographie ou la soumission/modification d'événements et de lieux depuis l'interface publique …</p><p>Ce pack comprend le composant JEM associé aux modules et plugins essentiels suivants : </p><ul><li>Plugin Finder (recherche intelligente)</li><li>Plugin Mailer</li><li>Plugin Commentaires</li><li>Plugin Liste de contenu Événements</li><li>Plugin Embed</li><li>Plugin Quick Icon</li><li>Plugin Action Log</li><li>Module de base Derniers événements</li><li>Module large Derniers événements</li><li>Module Calendrier</li><li>Module Teaser</li><li>Module Banner</li><li>Module Jubilee</li><li>Module Venues Map</li><li>Module Types</li></ul><p>Si vous souhaitez utiliser l'un de ces modules et plugins, n'oubliez pas de les publier dans le gestionnaire de modules et le gestionnaire de plugins dans le backend de votre site. </p><p>L'assistance communautaire est disponible à l'adresse <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>[www.joomlaeventmanager.net/forum](https://www.joomlaeventmanager.net/forum)</a></p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Journal des modifications</a></p><p>JEM est basé sur Eventlist de Christoph Lukes.</p>"
COM_JEM_NOTIFICATION_TEMPLATES="Notification Templates"
COM_JEM_NOTIFICATIONS="Notifications"
COM_JEM_TAX_RATES="Tax rates"
