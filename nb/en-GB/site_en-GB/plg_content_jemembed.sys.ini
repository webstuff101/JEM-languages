PLG_CONTENT_JEMEMBED="JEM - Innbyggingsutvidelse"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="JEM innebygd utvidelse gir et avgrenset JSON API for offentlig JEM hendelsesdata."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>Utvidelsen tilbyr publiserte JEM-arrangementer som JSON for en server-side integrasjon eller proxy. Hold API-token på serveren og send den i HTTP-headeren <code>Authorization: Bearer YOUR_SECURITY_TOKEN</code>. Tokens i URL-spørringsparametere avvises fordi URL-er kan lagres i nettleserhistorikk, serverlogger, henvisere og mellomliggende hurtigbuffere.</p><p><strong>Endepunkt</strong><br><code>https://domene.eksempel/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;type=upcoming&amp;max=10</code></p><p><strong>Parametere</strong><br><code>type=today|unfinished|ongoing|upcoming|archived|newest|open|all<br>featured=on|off|only<br>title=on|link|off<br>date=on|link|off<br>time=on|off<br>enddatetime=on|off<br>catids=[opptil 50 kommaseparerte kategori-ID-er]<br>category=on|link|off<br>venueids=[opptil 50 kommaseparerte lokasjons-ID-er]<br>venue=on|link|off<br>max=1..100<br>start=0..10000<br>cuttitle=1..500<br>dateformat=[opptil 64 tegn]<br>timeformat=[opptil 64 tegn]<br>noeventsmsg=[ren tekst opptil 200 tegn]</code></p><p>Bruk <code>meta.next_start</code> som neste <code>start</code>-verdi mens den ikke er null. Featured-verdiene følger JEM Eventslist-semantikk: <code>on</code> inkluderer alle arrangementer, <code>off</code> ekskluderer utvalgte arrangementer og <code>only</code> returnerer kun utvalgte arrangementer. Resultater evalueres alltid med offentlig gjestetilgang, bufres kort og beskyttes av faste forespørselskvoter. Konfigurer <strong>Kanonsk JEM-URL</strong> når eksterne forbrukere krever absolutte lenker; ellers returneres sikre relative lenker.</p><p><strong>Eksempel for eksternt nettsted</strong></p><ol><li>Last ned og pakk ut <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemevents.zip</a>.</li><li>Last opp <code>jemevents.php</code> og <code>jemevents.js</code> til det eksterne nettstedet.</li><li>Angi kilde-URL og token i den server-side <code>jemevents.php</code>-filen.</li><li>Inkluder <code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code> og legg til <code>&lt;div id='feed-container'&gt;&lt;/div&gt;</code> på siden.</li></ol>"

