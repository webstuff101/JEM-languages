PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_DESC="Dersom aktivert, må API-forespørsler sende et gyldig token i Godkjenningsbærerheaderen. Deaktivering av autentiseringen holder de faste offentlige forespørselsgrensene aktiv."
