PLG_CONTENT_JEMEMBED_BASE_URL_LABEL="Kanonisk JEM URL"
PLG_CONTENT_JEMEMBED_BASE_URL_DESC="Valgfri klarert HTTP(S) grunn-URL som brukes til å lage absolutt arrangement, lokale og kategorikoblinger, for eksempel https://events. xample.org. Hvis den er tom eller ugyldig, returnerer API-et relative linker og stammer aldri en opprinnelse fra vertshodet."

