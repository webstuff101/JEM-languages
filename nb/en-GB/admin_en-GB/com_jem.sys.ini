JEM="JEM"
COM_JEM="JEM"
COM_JEM_INSTALLATION_XML_DESCRIPTION="JEM er en arrangementskomponent for Joomla."
COM_JEM_INSTALLATION_DESCRIPTION="<p>JEM er en arrangementskomponent for Joomla.</p><p>Det er ikke en klassisk kalender – det er en enkel måte å administrere og presentere arrangementene dine for gruppen, bedriften eller fellesskapet ditt.<br>JEM tilbyr mange funksjoner og muligheter som gjør arbeidet ditt enklere, som for eksempel lokasjonsdatabase, gjentakelse av arrangementer og mye mer.<br>Men også for besøkende på nettstedet ditt har JEM flere tilleggsfunksjoner å tilby, som et enkelt påmeldingssystem, lenk til karttjenester, eller innsending/redigering av arrangementer og lokasjoner fra grensesnittet …</p><p>Denne pakken består av JEM-komponenten sammen med følgende viktige moduler og utvidelser:</p><ul><li>Finder-utvidelse (smartsøk)</li><li>E-postutvidelse</li><li>Kommentarutvidelse</li><li>Innholdsutvidelse for listing av arrangementer</li><li>Innebyggingsutvidelse</li><li>Hurtigikon-utvidelse</li><li>Handlingslogg-utvidelse</li><li>Grunnmodul for siste arrangementer</li><li>Bredmodul for siste arrangementer</li><li>Kalendermodul</li><li>Teasermodul</li><li>Bannermodul</li><li>Jubileumsmodul</li><li>Lokasjonskartmodul</li><li>Typer-modul</li></ul><p>Hvis du vil bruke noen av disse modulene og utvidelsene, må du huske å publisere dem i modulbehandleren og utvidelsesbehandleren i nettstedets backend.</p><p>Fellesskapsstøtte finner du på <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>www.joomlaeventmanager.net/forum</a></p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Endringslogg</a></p><p>JEM er basert på Eventlist av Christoph Lukes.</p>"
COM_JEM_NOTIFICATION_TEMPLATES="Varslings maler"
COM_JEM_NOTIFICATIONS="Varsler"
COM_JEM_TAX_RATES="Skatte satser"
COM_JEM_INSTALLATION_HEADER="av <a href='https://www.joomlaeventmanager.net' target='_blank'>joomlaeventmanager.net</a><br>Utgitt under vilkårene i <a href='https://www.gnu.org/licenses/gpl-3.0' target='_blank'>GNU General Public License</a>."

