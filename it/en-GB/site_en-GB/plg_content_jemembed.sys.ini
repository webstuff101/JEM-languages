PLG_CONTENT_JEMEMBED="JEM - Plugin Incorpora"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="Il plugin JEM Embed fornisce un'API JSON delimitata per i dati degli eventi JEM pubblici."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>Il plugin fornisce gli eventi JEM pubblicati come JSON per l'integrazione o il proxy lato server. Mantieni il token API sul server e invialo nell'intestazione HTTP <code>Authorization: Bearer YOUR_SECURITY_TOKEN</code> I token nei parametri della query di URL vengono rifiutati perché gli URL possono essere memorizzati nella cronologia del browser, nei log del server, nei referrer e nelle cache intermediarie.</p><p><strong>Endpoint</strong><br><code>https://dominio.esempio/index. hp?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;type=upcoming&amp;max=10</code></p><p><strong>Parametri</strong><br><code>type=today<unk> unfinished<unk> ongoing<unk> upcoming<unk> archived<unk> newest<unk> open<unk> all<br>featured=on<unk> off<unk> solo<br>title=on<unk> link<unk> off<br>date=on<unk> link<unk> off<br>time=on<unk> off<br>enddatetime=on<unk> off<br>catids=[fino a 50 IDs]<br>categoryon<unk> link<unk> off<br>venueids=50 [fino a 50 ID-separate da<br>max<unk> off<br>100<br>inizio=0..10000<br>cuttitle=1. 00<br>dateformat=[fino a 64 caratteri]<br>timeformat=[fino a 64 caratteri]<br>noeventsmsg=[testo semplice fino a 200 caratteri]</code></p><p>Utilizza <code>meta. ext_start</code> come <code>inizia</code> valore mentre non è nullo. I valori in evidenza seguono la semantica di JEM Eventslist: <code>su</code> include tutti gli eventi <code>off</code> esclude gli eventi in evidenza e <code>solo</code> restituisce solo eventi in evidenza. I risultati sono sempre valutati con accesso pubblico agli ospiti, brevemente memorizzati nella cache e protetti da contingenti di richiesta fissi. Configurare <strong>Canonical JEM URL</strong> quando i consumatori esterni richiedono collegamenti assoluti; altrimenti vengono restituiti link relativi sicuri.</p><p><strong>Esempio di sito web esterno</strong></p><ol><li>Scaricare ed estrarre <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemeventi. ip</a>.</li><li>Upload <code>jemevents hp</code> e <code>jemevents.js</code> sul sito esterno</li><li>Imposta l'URL di origine e il token nel lato server <code>jemevents.php</code> file.</li><li>Include <code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code> e aggiungere <code>&lt;div id='feed-container'&gt;&lt;/div&gt;</code> alla pagina.</li></ol>"

