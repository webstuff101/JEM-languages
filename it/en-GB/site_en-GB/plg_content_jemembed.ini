PLG_CONTENT_JEMEMBED="JEM - Plugin Incorpora"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_LABEL="Richiedi Token API"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_DESC="Se abilitata, le richieste API devono inviare un token valido nell'intestazione del Portatore autorizzazione. La disattivazione dell'autenticazione mantiene attivi i limiti di richiesta pubblici fissi."
PLG_CONTENT_JEMEMBED_API_TOKENS_LABEL="Token API"
PLG_CONTENT_JEMEMBED_API_TOKENS_DESC="Inserisci fino a 20 token casuali lunghi, separati da virgola. Per la conservazione senza il segreto originale, utilizzare sha256: seguito dal suo 64-caratteri SHA-256 digest. Più voci consentono la rotazione sicura del token."
PLG_CONTENT_JEMEMBED_BASE_URL_LABEL="Url Jem Canonico"
PLG_CONTENT_JEMEMBED_BASE_URL_DESC="URL di base HTTP(S) affidabile opzionale utilizzato per creare collegamenti di evento, location e categoria assoluti, ad esempio https://eventi. xample.org. Se vuoto o non valido, l'API restituisce link relativi e non deriva mai un'origine dall'intestazione Host della richiesta."

