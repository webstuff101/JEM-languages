; Backend SYS file

JEM="JEM"
COM_JEM="JEM"
COM_JEM_INSTALLATION_XML_DESCRIPTION="JEM ist eine Event Management Komponente für Joomla."
COM_JEM_INSTALLATION_DESCRIPTION="<p>JEM ist eine Event Management Komponente for Joomla.</p><p>Es ist kein klassischer Kalender – es ist ein einfacher Weg Deine Events für Deine Gruppe, Gesellschaft oder Gemeinschaft zu verwalten und zu präsentieren.<br>JEM bietet viele Features und Möglichkeiten, die Deine Arbeit erleichtern, z.B. Lokalitäten DB, Eventwiederholungen und viel mehr.<br>Aber auch für die Besucher der Seite, hat JEM einige zusätzliche Features zu bieten, z.B. ein einfaches Eventanmeldesystem, Kartendienste, oder die Einreichung/Bearbeitung von Links und Lokalitäten direkt vom Frontend aus. …</p><p>Dieses Paket enthält neben der JEM Komponente die folgenden essentiellen Module und Plugins:</p><ul><li>Smart search Plugin (finder)</li><li>Mailer Plugin</li><li>Kommentar Plugin</li><li>Content List Events Plugin</li><li>Embed Plugin</li><li>Quick Icon Plugin</li><li>Action Log Plugin</li><li>Latest Events Basic Modul</li><li>Latest Events Wide Modul</li><li>Kalender Modul</li><li>Teaser Modul</li><li>Banner Modul</li><li>Jubilee Modul</li><li>Venues Map Modul</li><li>Typem Modul</li></ul><p>Willst Du diese Module und Plugins verwenden, vergiss bitte nicht, sie im Plugin Manager im Backend zu aktivieren.</p><p>Community Support ist unterhalten auf <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>www.joomlaeventmanager.net/forum</a></p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Changelog</a></p><p>JEM basiert auf Eventlist von Christoph Lukes.</p>"
COM_JEM_INSTALLATION_HEADER="von <a href='https://www.joomlaeventmanager.net' target='_blank'>joomlaeventmanager.net</a><br>Veröffentlicht unter den Bedingungen der <a href='https://www.gnu.org/licenses/gpl-3.0' target='_blank'>GNU General Public License</a>."

