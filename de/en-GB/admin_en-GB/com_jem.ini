COM_JEM_IMPORT_EXTERNAL_VENUES_CSV_HELP_DESC="Verwenden Sie die erste Zeile als Feldnamen. Bei CSV-Dateien wird das in den JEM-Einstellungen festgelegte Trennzeichen verwendet; zudem erfolgt ein automatischer Abgleich von Semikolon, Komma und Tabulator. Bei XLSX-Dateien wird das erste Tabellenblatt eingelesen. Ein Veranstaltungsortname genügt für den Start; eine Spalte mit Koordinaten (Breiten- und Längengrad) wird automatisch aufgeteilt."
