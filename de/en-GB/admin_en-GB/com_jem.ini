COM_JEM_IMPORT_EXTERNAL_VENUES_DESC="Wählen Sie eine CSV-, JSON-, XML- oder XLSX-Datei oder ein gespeichertes Profil aus und ordnen Sie deren Spalten den Standortfeldern zu – wie etwa Adresse, Koordinaten, Typ, Sprache und benutzerdefinierten Feldern."
