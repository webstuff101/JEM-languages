PLG_CONTENT_JEMEMBED="JEM - Einbettung-Plugin"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="Das JEM Embed Plugin stellt eine begrenzte JSON-API für öffentliche JEM-Ereignisdaten zur Verfügung."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Embed</h3><p>Das Plugin stellt veröffentlichte JEM-Ereignisse als JSON für eine serverseitige Integration oder einen Proxy bereit. Bewahren Sie das API-Token auf dem Server auf und senden Sie es im HTTP-Header <code>Authorization: Bearer YOUR_SECURITY_TOKEN</code>. Token in URL-Abfrageparametern werden abgelehnt, da URLs im Browserverlauf, in Serverprotokollen, in Referrern und in zwischengeschalteten Caches gespeichert werden können. </p><p><strong>Endpunkt</strong><br><code>https://domain.example/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;type=upcoming&amp;max=10</code></ p><p><strong>Parameter</strong><br><code>type=today|unfinished|ongoing|upcoming|archived|newest|open|all<br>featured=on|off|only<br>title=on|link|off<br>date=on|link|off<br>time=on|off<br>enddatetime=on|off<br>catids= [bis zu 50 durch Kommas getrennte Kategorie-IDs]<br>category=on|link|off<br>venueids=[bis zu 50 durch Kommas getrennte Veranstaltungsort-IDs]<br>venue=on|link|off<br>max=1..100<br>start=0..10000<br>cuttitle=1.. 500<br>dateformat=[bis zu 64 Zeichen]<br>timeformat=[bis zu 64 Zeichen]<br>noeventsmsg=[Klartext mit bis zu 200 Zeichen]</code></p><p>Verwende <code>meta.next_start</code> als nächsten <code>start</code>-Wert, solange dieser nicht null ist. Die „featured“-Werte folgen der JEM-Eventslist-Semantik: <code>on</code> umfasst alle Ereignisse, <code>off</code> schließt „featured“-Ereignisse aus und <code>only</code> gibt nur „featured“-Ereignisse zurück. Die Ergebnisse werden stets mit öffentlichem Gastzugang ausgewertet, kurzzeitig zwischengespeichert und durch feste Anfragequoten geschützt. Konfigurieren Sie <strong>Canonical JEM URL</strong>, wenn externe Nutzer absolute Links benötigen; andernfalls werden sichere relative Links zurückgegeben. </p><p><strong>Beispiel für eine externe Website</strong></p><ol><li>Laden Sie <a href=‚/media/plg_content_jemembed/files/jemevents.zip‘>jemevents.zip</a> herunter und entpacken Sie die Datei.</li><li>Laden Sie <code>jemevents.php</code> und <code>jemevents.js</code> auf die externe Website hoch. </li><li>Legen Sie die Quell-URL und das Token in der serverseitigen Datei <code>jemevents.php</code> fest.</li><li>Fügen Sie <code>&lt;script src=‚/jemevents.js‘&gt;&lt;/script&gt;</code> ein und fügen Sie <code>&lt;div id=‚feed-container‘&gt;&lt;/div&gt;</code> zur Seite hinzu. </li></ol>"

