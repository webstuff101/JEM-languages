MOD_JEM_BANNER_OFFSET_HOURS_DESC="Verschiebt die Zeit in die Zukunft (mit positiven Werten) oder in die Vergangenheit (mit negativen Werten). Wird nur für nicht archivierte Events verwendet. Bei heutigen Veranstaltungen wird gerundet auf ganze Tage.<br>Beispiele: Zur Anzeige von Veranstaltungen, die wenigstens vor zwei Stunden beendet wurden, Typ auf 'unbeendet' und Zeitverschiebung auf '-2' setzen. Für Veranstaltungen, die erst in einer Woche oder später beginnen, Typ auf kommend und Offset auf 168 (7 * 24) setzen. Zur Anzeige von morgigen Veranstaltungen, Typ auf 'Heute' und Zeitverschiebung auf '24' setzen."
