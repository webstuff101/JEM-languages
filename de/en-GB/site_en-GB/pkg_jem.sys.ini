PKG_JEM="JEM - Paket"
PKG_JEM_INSTALLATION_DESCRIPTION="<p>JEM ist eine Event-Management-Komponente für Joomla.</p><p>Es ist kein klassischer Kalender – es ist eine einfache Möglichkeit, deine Veranstaltungen für deinen Verein, dein Unternehmen oder deine Community zu verwalten und zu präsentieren.<br />JEM bietet viele Funktionen und Möglichkeiten, die deine Arbeit erleichtern, wie die Veranstaltungsort-Datenbank, Veranstaltungswiederholungen und vieles mehr.<br />Aber auch für deine Website-Besucher hat JEM einige zusätzliche Funktionen zu bieten, wie ein einfaches Anmeldesystem, Kartendienst-Links oder das Einreichen/Bearbeiten von Veranstaltungen und Veranstaltungsorten über das Frontend ...</p><p>Dieses Installationspaket besteht aus der JEM-Komponente in Kombination mit den folgenden Modulen und Plugins:</p><div class='row'><div class='col-md-6'><h3>Module</h3><ul><li>Events Basic-Modul</li><li>Events Wide-Modul</li><li>Kalender-Modul</li><li>Lokalitäten Karten Modul</li><li>Teaser-Modul</li><li>Banner-Modul</li><li>Jubiläums-Modul</li><li>Typen-Modul</li></ul></div><div class='col-md-6'><h3>Plugins</h3><ul><li>Content List Events-Plugin</li><li>Embed-Plugin</li><li>Finder-Plugin (Smart Search)</li><li>Kommentar-Plugin</li><li>Mailer-Plugin</li><li>Quick Icon-Plugin</li><li>Action Log-Plugin</li></ul></div></div><p>Wenn du eines dieser Module und Plugins verwenden möchtest, vergiss nicht, sie im Modul-Manager und im Plugin-Manager im Backend deiner Website zu veröffentlichen.</p><p>Community-Support wird unter <a href='https://www.joomlaeventmanager.net/forum' target='_blank'>www.joomlaeventmanager.net/forum</a> angeboten.</p><p><a href='https://www.joomlaeventmanager.net/download' target='_blank'>Changelog</a></p><p>JEM basiert auf Eventlist von Christoph Lukes.</p>"

