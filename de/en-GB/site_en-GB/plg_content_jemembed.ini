PLG_CONTENT_JEMEMBED="JEM - Einbettung-Plugin"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_LABEL="Erforderliches API-Token"
PLG_CONTENT_JEMEMBED_REQUIRE_TOKEN_DESC="Wenn aktiviert, müssen API-Anfragen ein gültiges Token in der Kopfzeile \"Authorization Bearer\" senden. Das Deaktivieren der Authentifizierung hält die festgelegten öffentlichen Abfragelimits aktiv."
PLG_CONTENT_JEMEMBED_API_TOKENS_LABEL="API-Token"
PLG_CONTENT_JEMEMBED_API_TOKENS_DESC="Geben Sie bis zu 20 lange zufällige Token ein, kommasepariert. Für die Speicherung ohne das ursprüngliche Geheimnis verwenden Sie sha256: gefolgt von seinem 64 Zeichen SHA-256 Digest."
PLG_CONTENT_JEMEMBED_BASE_URL_LABEL="Kanonische JEM-URL"
PLG_CONTENT_JEMEMBED_BASE_URL_DESC="Optionale HTTP(S) Basis-URL, die zum Erstellen von absoluten Events, Veranstaltungsorten und Kategorie-Links verwendet wird, zum Beispiel https://events. xample.org. Falls leer oder ungültig ist, gibt die API relative Links zurück und leitet niemals einen Ursprung aus dem Request-Host-Header ab."

