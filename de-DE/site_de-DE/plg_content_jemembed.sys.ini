PLG_CONTENT_JEMEMBED="JEM - Einbettung-Plugin"
PLG_CONTENT_JEMEMBED_XML_DESCRIPTION="Das JEM Einbettung-Plugin erstellt ein JSON API zu Event Daten aus der JEM Komponente."
PLG_CONTENT_JEMEMBED_XML_INSTRUCTION="<h3>JEM Einbettung</h3><p>Das Plugin gibt JEM Events als JSON aus, das auf verschiedene Arten verwendet werden kann,&nbsp;z.B.&nbsp;um JEM Events in externen Webseiten anzuzeigen (siehe folgende Anleitung).</p><p>Standart-Parameter für die Ausgabe sind definiert hier in der Plugin-Konfiguration. Die&nbsp;Parameter können ergänzt und korrigiert werden durch Parameter in der Ausgabe-URL.</p><p>Beispiel:<br /><code class='rl_code'>https://domain.com/index.php?option=com_ajax&amp;plugin=jemembed&amp;group=content&amp;format=json&amp;token=YOUR_SECURITY_TOKEN&amp;max=10&amp;venueids=1,2&amp;category=2,3,5</code></p><p><strong>Die Parameter</strong><br /><code class='rl_code'>type=today|unfinished|upcoming|archived|newest<br />featured=on|off|only<br />title=on|link|off<br />date=on|link|off<br />time=on|off<br />enddatetime=on|off<br />catids=[Komma getrennte Kategorie-IDs]<br />category=on|link|off<br />venueids=[Komma getrennte Venue IDs]<br />venue=on|link|off<br />max=n<br />cuttitle=n<br />noeventsmsg=[Mitteilungstext, wenn kein solcher Event vorhanden]</code></p><p>Wenn Du mehr als einen Parameter verwendest, müssen sie mit logischem AND kombiniert werden. Das bedeutet, dass nur Events angezeigt werden, bei denen ALLE Bedingungen erfüllt sind.</p><p><strong>Token</strong>: Sicherheits-Token, um unerlaubte Abfragen zu verhindern, werden in den Plugins-Einstellungen definiert.</p><p><strong>Erklärungen</strong>:</p><code>n</code>: eine positive Zahl<br /><code>|</code>: trennt Optionen, die Du wählen kannst von<br /><code>type=today</code>: Heutige Events<br /><code>type=unfinished</code>: Kommende und laufende Events<br /><code>type=upcoming</code>: Kommende, noch nicht gestartete Events<br /><code>type=archived</code>: Archivierte Events<br /><code>type=newest</code>: Zuletzt erstellte Events (Events mit dem höchsten IDs)<br /><code>max</code>: max. Anzahl angezeigter Events<br /><code>cuttitle</code>: max. Titel-Länge<br /><code>noeventsmsg</code>: Anzuzeigende Mitteilung, wenn keine solchen Events vorhanden sind.<p><p><strong>Wie können die JEM Events in eine externe Webseite eingebettet werden: </strong></p><ol><li><strong>Runterladen und extrahieren</strong><br />Die Zip-Datei herunterladen <a href='/media/plg_content_jemembed/files/jemevents.zip'>jemevents.zip</a> und extrahieren. Du erhältst die folgenden vier Dateien: <ul><li><code>jemevents.php </code></li><li><code> jemevents.js</code></li><li><code> jemevents-example.html</code> (Beispielseite, die zeigt, wie einbetten geschieht) </li><li><code> readme.txt</code> (mit der Anleitung die die Dateien verwendet werden)</li></ul></li><li></strong>Hochladen der Dateien auf deinen Webserver</strong><br />Die Dateien<code> jemevents.php</code> und <code>jemevents.js</code> in den Webspace der externen Webseite hochladen.<br /><em>Beachte: Die Datei<code> jemevents-example.html </code>ist optional und nur als Referenz.</em></li><li><strong>Einstellungen konfigurieren</strong><br />Öffne die Datei <code>jemevents.php</code> und fülle in die Sektion Konfiguration entsprechend Deiner Bedürfnisse.</li><li><strong>JavaScript-Datei einfügen</strong><br />Auf der Webseite am Ort, wo du die Events anzeigen möchtest fügst du die folgende Linie direkt vor dem schließenden <code>&lt;/body&gt; </code>Tag ein:<br /><code>&lt;script src='/jemevents.js'&gt;&lt;/script&gt;</code></li><li></strong>Container für die Events hinzufügen</strong><br />Am gewünschten Ort in der Seite, füge das folgende HTML-Element ein:<br /><code>&lt;div id='jemevents-container'&gt;&lt;/div&gt;</code></li></ol>"
