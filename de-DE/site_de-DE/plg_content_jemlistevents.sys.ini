PLG_CONTENT_JEMLISTEVENTS="JEM - Listevents Plugin"
PLG_CONTENT_JEMLISTEVENTS_XML_DESCRIPTION="Plugin zur Anzeige von JEM-Events innerhalb von Joomla-Inhalten"
PLG_CONTENT_JEMLISTEVENTS_XML_INSTRUCTION="<div class='jem-documentation'><h1 class='jem-title'>JEM List Events</h1><div class='jem-documentation'><p class='jem-intro'>Das <strong>JEM List Events</strong> Plugin ermöglicht es, JEM-Veranstaltungen nahtlos in Joomla-Artikel oder benutzerdefinierten Module zu integrieren. Verwende den <code>{jemlistevents}</code> Tag mit optionalen Parametern, um die Anzeige von Veranstaltungen anzupassen.</p><h2 class='jem-section-title'>Verwendung</h2><p class='jem-instruction'>Folgenden Tag im Inhalt einfügen:</p><div class='jem-code'><code>{jemlistevents}</code></div><p class='jem-instruction'>Stelle die Standardparameter in den Plugin-Einstellungen ein.<br />Um die Ausgabe des Tags anzupassen, kannst du die Standardparameter im Tag selbst ändern. Hier ist die vollständige Syntax:</p><div class='jem-code'><code>{jemlistevents [type=today|unfinished|ongoing|upcoming|archived|newest|open|all]; [featured=on|off|only]; [title=on|link|off]; [date=on|link|off]; [time=on|off]; [enddatetime=on|off]; [eventids=n]; [catids=n]; [category=on|link|off]; [venueids=n]; [venue=on|link|off]; [max=n]; [cuttitle=n]; [noeventsmsg=msg]}</code></div><p class='jem-note'><strong>Hinweis:</strong> Ersetze <code>n</code> durch eine positive Zahl, und <code>|</code>zeigt die verschiedenen Optionen an (wähle eine), siehe Beispiel unten.</p><h2 class='jem-section-title'>Parameter-Details</h2><div class='jem-parameters'><ul class='jem-parameter-list'><li class='jem-parameter'><strong>type</strong>: Gibt an, welche Veranstaltungen angezeigt werden sollen.<ul class='jem-sub-parameters'><li><code>today</code>: Veranstaltungen, die heute stattfinden.</li><li><code>unfinished</code>: Bevorstehende und laufende Veranstaltungen.</li><li><code>ongoing</code>: Laufende Veranstaltungen, die jetzt stattfinden.</li><li><code>upcoming</code>: Zukünftige Veranstaltungen, die noch nicht begonnen haben.</li><li><code>archived</code>: Archivierte Veranstaltungen.</li><li><code>newest</code>: Kürzlich hinzugefügte Veranstaltungen (basierend auf den höchsten IDs).</li><li><code>open</code>: Offene Veranstaltungen ohne Datum/Uhrzeit</li><li><code>all</code>: Alle Veranstaltungen (vergangene, laufende, bevorstehende und archivierte)</li></ul></li><li class='jem-parameter'><strong>featured</strong>: Hervorgehobene Veranstaltungen einbeziehen.<ul class='jem-sub-parameters'><li><code>on</code>: Hervorgehobene und nicht hervorgehobene Veranstaltungen anzeigen.</li><li><code>off</code>: Nur nicht hervorgehobene Veranstaltungen anzeigen (hervorgehobene ausblenden).</li><li><code>only</code>: Nur hervorgehobene Veranstaltungen anzeigen.</li></ul></li><li class='jem-parameter'><strong>title</strong>: Veranstaltungstitel anzeigen.<ul class='jem-sub-parameters'><li><code>on</code>: Titel anzeigen.</li><li><code>link</code>: Titel als Links anzeigen.</li><li><code>off</code>: Titel ausblenden.</li></ul></li><li class='jem-parameter'><strong>date</strong>: Veranstaltungsdaten anzeigen.<ul class='jem-sub-parameters'><li><code>on</code>: Daten anzeigen.</li><li><code>link</code>: Daten als Links anzeigen.</li><li><code>off</code>: Daten ausblenden.</li></ul></li><li class='jem-parameter'><strong>time</strong>: Veranstaltungszeiten anzeigen.<ul class='jem-sub-parameters'><li><code>on</code>: Zeiten anzeigen.</li><li><code>off</code>: Zeiten ausblenden.</li></ul></li><li class='jem-parameter'><strong>enddatetime</strong>: Enddatum/-zeit der Veranstaltung anzeigen.<ul class='jem-sub-parameters'><li><code>on</code>: Enddatum/-zeit anzeigen.</li><li><code>off</code>: Enddatum/-zeit ausblenden.</li></ul></li><li class='jem-parameter'><strong>eventids</strong>: Veranstaltungen nach Event-IDs filtern (z.B., <code>eventids=3,10,12</code>).</li><li class='jem-parameter'><strong>catids</strong>: Veranstaltungen nach Kategorie-IDs filtern (z.B. <code>catids=2,14</code>).</li><li class='jem-parameter'><strong>category</strong>: Veranstaltungskategorien anzeigen.<ul class='jem-sub-parameters'><li><code>on</code>: Kategorien anzeigen.</li><li><code>link</code>: Kategorien als Links anzeigen.</li><li><code>off</code>: Kategorien ausblenden.</li></ul></li><li class='jem-parameter'><strong>venueids</strong>: Veranstaltungen nach Veranstaltungsort-IDs filtern (z.B. <code>venueids=2,4</code>).</li><li class='jem-parameter'><strong>venue</strong>: Veranstaltungsorte anzeigen.<ul class='jem-sub-parameters'><li><code>on</code>: Veranstaltungsorte anzeigen.</li><li><code>link</code>: Veranstaltungsorte als Links anzeigen.</li><li><code>off</code>: Veranstaltungsorte ausblenden.</li></ul></li><li class='jem-parameter'><strong>max</strong>: Anzahl der angezeigten Veranstaltungen begrenzen (z.B. <code>max=5</code>).</li><li class='jem-parameter'><strong>cuttitle</strong>: Länge der Veranstaltungstitel begrenzen (z.B. <code>cuttitle=25</code>).</li><li class='jem-parameter'><strong>noeventsmsg</strong>: Benutzerdefinierte Nachricht, die angezeigt wird, wenn keine Veranstaltungen gefunden werden (z.B. <code>noeventsmsg='Keine Veranstaltungen gefunden'</code>).</li></ul></div><h2 class='jem-section-title'>Beispiel</h2><p class='jem-instruction'>Um bis zu 5 bevorstehende Veranstaltungen aus den Kategorien 2 und 14 anzuzeigen, verwende:</p><div class='jem-code'><code>{jemlistevents type=upcoming; catids=2,14; max=5; noeventsmsg='Keine Veranstaltungen gefunden'}</code></div><br /><h2 class='jem-section-title'>Datums- und Zeitformatierung</h2><p class='jem-instruction'>Für erweiterte Datums- und Zeitformatierung, konsultiere die <a class='jem-link' href='https://www.php.net/manual/datetime.format.php' target='_blank'>PHP DateTime Dokumentation</a>.</p><p class='jem-outro'>Viel Freude bei der Verwendung des JEM List Events Plugins zur Verbesserung deiner Joomla-Inhalte!</p>\n</div>"
