PLG_CONTENT_JEMLISTEVENTS_TYPE_LABEL="Event-Typ"
PLG_CONTENT_JEMLISTEVENTS_TYPE_DESCRIPTION="Spezifiziere, welche Events angezeigt werden: <strong>heutige</strong>: Events, die heute stattfinden <strong>unbeendete</strong>: Kommende und laufende Events. <strong>laufende</strong>: laufende Events, die gerade jetzt sind. <strong>kommende</strong>: Zukünftige noch nicht begonnene Events. <strong>archivierte</strong>: Vergangene Events. <strong>neuste</strong>: Zuletzt erstellte Events (basierend auf den höchsten IDs). <strong>offene</strong>: Offene Events ohne Datum/Zeit. <strong>alle</strong>: Alle Events (vergangene, laufende, kommende und archivierte)."
